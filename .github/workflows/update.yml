name: Auto Update YouTube Streams

on:
  schedule:
    # Her 3 saatte bir otomatik çalışır
    - cron: '0 */3 * * *'
  workflow_dispatch: # Elle tetiklemek için

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu Klonla
        uses: actions/checkout@v3

      - name: Python ve yt-dlp Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Betiği Çalıştır
        run: python update.py

      - name: Değişiklikleri Git'e Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Auto-updated YouTube stream links" || exit 0
          git push
name: Auto Update YouTube Streams

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

# Botun repoya yazabilmesi için gerekli izinler
permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu Klonla
        uses: actions/checkout@v4

      - name: Python ve yt-dlp Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Betiği Çalıştır
        run: python update.py

      - name: Değişiklikleri Git'e Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Auto-updated YouTube stream links"
          git push
